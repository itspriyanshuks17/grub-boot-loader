# AuroraBoot configuration  ->  copy to  <ESP>\EFI\AuroraBoot\aurora.conf
# Lines starting with # are comments.

title      = AuroraBoot
subtitle   = Choose an operating system
timeout    = 8            # seconds until autoboot; 0 = wait forever
default    = windows      # substring of the entry name to preselect
theme      = aurora       # aurora | ember | glacier | neon
#accent    = #009AA6      # your brand color (overrides theme; press T to cycle)
#accent2   = #0B6F7A
#resolution = 1920x1080   # or "auto" (largest mode up to 1080p)
show_title = true         # false if your logo already contains the name
show_system_items = true  # Firmware Setup / Restart / Shut Down cards
show_paths = true
#hide      = shell,removable   # comma-separated name fragments to hide

# Add entries the scanner can't find. Path is relative to the ESP.
#[entry]
#name = Rescue Shell
#path = /EFI/tools/shellx64.efi
