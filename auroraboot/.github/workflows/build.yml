name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gnu-efi gcc make
      - run: make
      - uses: actions/upload-artifact@v4
        with: { name: AuroraBoot-x64, path: "build/AuroraBoot.efi\nconfig/\ninstall/" }
